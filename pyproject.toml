[project]
name = "patchpilot"
version = "0.1.0"
description = "面向受支持 Python 仓库的受控代码修复 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "anthropic>=1.17,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
patchpilot = "patchpilot.cli:main"
patchpilot-service = "patchpilot.service.cli:main"
patchpilot-eval = "patchpilot.evaluation.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchpilot"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "pytest>=8,<10",
    "pyyaml>=6,<7",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
markers = ["docker: 需要真实 Docker Linux 引擎与预构建测试镜像的集成测试", "postgres: 需要真实 PostgreSQL 的并发与持久化集成测试"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".patchpilot-runs", ".patchpilot-service", ".patchpilot-evals", ".patchpilot-sessions", "benchmarks/tasks/*/repo"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
